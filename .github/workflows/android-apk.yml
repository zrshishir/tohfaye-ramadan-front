name: Build Android APK

# Two ways in:
#
#   * Manually from the Actions tab — choose the API and build type, then download the
#     APK from the run's Artifacts section. This is how you get a build to install.
#
#   * Automatically on any pull request that touches the Android project or this file,
#     so a change that breaks the APK build is caught in review rather than discovered
#     the next time someone needs a build.
#
# Nothing needs installing locally: the Ubuntu runners already ship a JDK and the Android
# SDK, which is the whole reason this lives in CI rather than on a developer's machine.
on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Backend API the APK will talk to'
        required: true
        default: 'https://prayerpulse.tazqiah.com/api'
      build_type:
        description: 'debug = installable immediately. release = unsigned unless signing secrets are set.'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
      - 'capacitor.config.json'
      - 'package.json'

jobs:
  build:
    name: Android APK
    runs-on: ubuntu-latest

    env:
      # `inputs` is empty on a pull_request event, so every value needs a fallback.
      API_BASE_URL: ${{ inputs.api_base_url || 'https://prayerpulse.tazqiah.com/api' }}
      BUILD_TYPE: ${{ inputs.build_type || 'debug' }}
      # Lifted to job level so the signing step's `if` can read it. A step cannot see its
      # own `env:` block from its `if:` — that is evaluated first.
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Vite inlines env values at build time, and vite.config.js deliberately throws when
      # VITE_BASE_URL is missing. That guard exists because a build once succeeded with the
      # value undefined and shipped an app whose every request went nowhere — the home
      # screen was simply blank.
      - name: Point the build at the chosen API
        run: |
          echo "VITE_BASE_URL=$API_BASE_URL" > .env
          echo "Building against $API_BASE_URL"

      - name: Run the check suites
        run: |
          npm run check:qibla
          npm run check:notifications
          npm run check:cache
          npm run check:reader

      - name: Build the web assets
        run: npm run build

      # Fail loudly rather than shipping an APK pointing somewhere useless. The URL is
      # compiled into the bundle, so this is the last moment it can be caught.
      - name: Verify the API URL was baked in
        run: |
          if ! grep -rqF "$API_BASE_URL" dist/assets/*.js; then
            echo "::error::$API_BASE_URL is not present in the built bundle."
            exit 1
          fi
          echo "Confirmed: the bundle targets $API_BASE_URL"

      # Capacitor 8 compiles against Java 21 (sourceCompatibility/targetCompatibility are
      # VERSION_21 in its Android library), so 17 no longer builds.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync the web build into the Android project
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # Signing is entirely secret-driven, so no key material is ever committed. Without
      # the secrets a release build still succeeds — it is simply unsigned, and Android
      # refuses to install an unsigned APK.
      #
      # build.gradle only wires up signingConfig when RELEASE_STORE_FILE is present, so
      # writing these properties is what activates it.
      - name: Configure signing
        if: env.BUILD_TYPE == 'release' && env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          {
            echo "RELEASE_STORE_FILE=release.keystore"
            echo "RELEASE_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "RELEASE_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "RELEASE_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } >> android/gradle.properties

      - name: Assemble the APK
        working-directory: android
        run: |
          if [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Locate the APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No APK was produced."
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Built $APK ($(du -h "$APK" | cut -f1))"

      - name: Report what was built
        run: |
          VERSION_NAME=$(grep -m1 'versionName' android/app/build.gradle | tr -d '"' | awk '{print $2}')
          VERSION_CODE=$(grep -m1 'versionCode' android/app/build.gradle | awk '{print $2}')
          TARGET_SDK=$(grep -m1 'targetSdkVersion' android/variables.gradle | awk -F'= ' '{print $2}')
          SIGNED="no — install will be refused until it is signed"
          if [ "$BUILD_TYPE" = "debug" ]; then
            SIGNED="yes, with the Android debug key (fine for sideloading)"
          elif [ -n "$KEYSTORE_BASE64" ]; then
            SIGNED="yes, with the release keystore"
          fi
          {
            echo "### Android APK"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Build type | \`$BUILD_TYPE\` |"
            echo "| Signed | $SIGNED |"
            echo "| API | \`$API_BASE_URL\` |"
            echo "| Version | \`$VERSION_NAME\` (code \`$VERSION_CODE\`) |"
            echo "| targetSdk | \`$TARGET_SDK\` |"
            echo "| Size | $(du -h '${{ steps.apk.outputs.path }}' | cut -f1) |"
            echo ""
            if [ "$TARGET_SDK" -lt 35 ]; then
              echo "> **Not publishable to Google Play.** From 31 August 2026, updates must"
              echo "> target API 36 and existing apps need API 35 to stay available to new"
              echo "> users. Reaching either requires Capacitor 5 → 7."
              echo ">"
              echo "> This build is for testing and direct install only."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: prayer-pulse-${{ env.BUILD_TYPE }}-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30
          if-no-files-found: error
